seed: 42
model:
  checkpoint: openmmlab/upernet-swin-tiny
  num_labels: 2
  crack_label: 1
data:
  manifest: artifacts/manifest_with_negatives.csv
  image_size: 512
  mask_threshold: 127
  synthetic_negative_probability: 0.25
  synthetic_negative_crop_size: 256
training:
  output_dir: checkpoints/upernet-swin-tiny
  epochs: 30
  batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 0.00006
  weight_decay: 0.01
  num_workers: 0
  mixed_precision: true
  freeze_batch_norm: true
  early_stopping_patience: 6
  focal_gamma: 2.0
  dice_weight: 1.0
  focal_weight: 1.0
  boundary_weight: 0.25
inference:
  tile_size: 512
  overlap: 96
  threshold: 0.5
  minimum_component_pixels: 8
  image_level_minimum_pixels: 16
  maximum_positive_ratio: 0.25
