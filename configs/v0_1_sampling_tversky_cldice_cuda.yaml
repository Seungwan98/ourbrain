seed: 42
model:
  checkpoint: D:\ourbrain\runs\v0-positive-only\checkpoint
  num_labels: 2
  crack_label: 1
data:
  manifest: D:\ourbrain\artifacts\manifest.csv
  image_size: 512
  mask_threshold: 127
  synthetic_negative_probability: 0.25
  synthetic_negative_crop_size: 256
  crack_centered_probability: 0.5
  crack_centered_crop_size: 384
training:
  output_dir: D:\ourbrain\runs\v0.1-sampling-tversky-cldice\checkpoint
  epochs: 15
  batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 0.00002
  weight_decay: 0.01
  num_workers: 0
