  tversky_alpha: 0.7
  tversky_beta: 0.3
  cldice_weight: 0.5
  cldice_iterations: 3
  lr_scheduler: cosine
  warmup_ratio: 0.1
  minimum_learning_rate_ratio: 0.1
  save_last_checkpoint: true
inference:
  tile_size: 512
  overlap: 96
  threshold: 0.5
  minimum_component_pixels: 8
  image_level_minimum_pixels: 16
  maximum_positive_ratio: 0.25
